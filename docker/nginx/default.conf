# WordPress vhost for the test environment: serve static files, proxy PHP through wp-fpm.
# nginx and wp-fpm both mount the site volume at /var/www/html, so SCRIPT_FILENAME resolves in fpm.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # No access logs — test traffic has no audit value, and per-request I/O adds latency.
    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wp-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Default (8 × 8k = 64k) is too small for typical WP admin responses and causes disk
        # buffering; 16 × 16k keeps them in memory and avoids the extra write round-trip.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        # No caching: prevents stale-asset issues between test runs.
        expires -1;
        log_not_found off;
    }
}
