<div id="bwpr-action-card" class="bwpr-graphs mdl-shadow--2dp mdl-color--white mdl-cell mdl-cell--8-col">
		<div id="restore_step" class="metabox-holder postbox backwpup-cleared-postbox backwpup-full-width action" data-nonce="0000000000">

	<h3 class="hndle"><span>Database Connection Settings.</span></h3>

	<form id="db-settings-form" action="#">
		<div class="flex flex-col gap-2">
			<label class="block relative border rounded font-title focus-within:border-secondary-base border-grey-500">
  <input name="db_host" type="text" id="db_host" class="input-base text-lg w-full" placeholder="" readonly="" value="REDACTED">
  <p class="input-base-label absolute left-4 flex items-center gap-2 transition-all top-2 text-xs text-grey-700">
    Database Host      </p>
</label>
<label class="block relative border rounded font-title focus-within:border-secondary-base border-grey-500">
  <input name="db_name" type="text" id="db_name" class="input-base text-lg w-full" placeholder="" readonly="" value="REDACTED">
  <p class="input-base-label absolute left-4 flex items-center gap-2 transition-all top-2 text-xs text-grey-700">
    Database Name      </p>
</label>
<label class="block relative border rounded font-title focus-within:border-secondary-base border-grey-500">
  <input name="db_user" type="text" id="db_user" class="input-base text-lg w-full" placeholder="" readonly="" value="REDACTED">
  <p class="input-base-label absolute left-4 flex items-center gap-2 transition-all top-2 text-xs text-grey-700">
    Database User      </p>
</label>
<label class="block relative border rounded font-title focus-within:border-secondary-base border-grey-500">
  <input name="db_pw" type="password" id="db_pw" class="input-base text-lg w-full" placeholder="" readonly="" value="REDACTED">
  <p class="input-base-label absolute left-4 flex items-center gap-2 transition-all top-2 text-xs text-grey-700">
    Database Password      </p>
</label>
		<!-- Hide Charset field by default. We assume we can find the charset automatically.
			Only show field if charset cannot determined automatically -->
		<div id="db-charset-field" class="hidden mdl-textfield mdl-js-textfield">
			<label class="block relative border rounded font-title focus-within:border-secondary-base border-grey-500">
  <input name="db_charset" type="text" id="db_charset" class="input-base text-lg w-full" placeholder="" readonly="" value="utf8mb4">
  <p class="input-base-label absolute left-4 flex items-center gap-2 transition-all top-2 text-xs text-grey-700">
    Database Charset      </p>
</label>
		</div>
	</div>
		<div id="db-form-btns" style="padding-top:20px;">
			<button id="db_edit_btn" class="button button-primary button-primary-bwp">
				Edit			</button>
			<button id="db_test_btn" class="button button-primary button-primary-bwp">
				Test Connection			</button>
			<button id="db_form_continue_btn" class="button button-primary button-primary-bwp step-loader" data-next-step="4">
				Continue			</button>
		</div>
	</form>

</div>
